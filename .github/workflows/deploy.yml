name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/deploy.yml'

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: peleg-repo
  ECS_CLUSTER: peleg-cluster
  ECS_SERVICE: peleg-service
  ECS_TASK_FAMILY: peleg-task   # <-- only the family, no revision

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2
      id: login-ecr

    - name: Build and push Docker image
      run: |
        cd app
        IMAGE_TAG=${GITHUB_SHA}
        ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
        docker build -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG .
        docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
        docker tag $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest
        docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest
        echo "image=$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG" >> $GITHUB_OUTPUT
      id: build-image
      shell: bash

    - name: Ensure .aws directory exists
      run: mkdir -p .aws

    - name: Get latest ECS task definition ARN
      id: latest-task-def
      run: |
        LATEST=$(aws ecs list-task-definitions \
          --family-prefix ${{ env.ECS_TASK_FAMILY }} \
          --region ${{ env.AWS_REGION }} \
          --sort DESC \
          --max-items 1 \
          --query "taskDefinitionArns[0]" \
          --output text || echo "")
        
        if [ -z "$LATEST" ] || [ "$LATEST" = "None" ]; then
          echo "No existing task definition found."
          echo "exists=false" >> $GITHUB_OUTPUT
        else
          echo "Found existing task definition: $LATEST"
          echo "arn=$LATEST" >> $GITHUB_OUTPUT
          echo "exists=true" >> $GITHUB_OUTPUT
        fi

    - name: Download latest task definition
      if: steps.latest-task-def.outputs.exists == 'true'
      run: |
        aws ecs describe-task-definition \
          --task-definition ${{ steps.latest-task-def.outputs.arn }} \
          --region ${{ env.AWS_REGION }} \
          --query taskDefinition > .aws/task-definition.json

    - name: Update ECS task definition with new image
      id: task-def
      if: steps.latest-task-def.outputs.exists == 'true'
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: .aws/task-definition.json
        container-name: peleg-container
        image: ${{ steps.build-image.outputs.image }}

    - name: Check task definition exists
      if: steps.latest-task-def.outputs.exists != 'true'
      run: |
        echo "Error: No existing task definition found for family '${{ env.ECS_TASK_FAMILY }}'"
        echo "Please ensure the task definition is created first (e.g., via Terraform)"
        exit 1

    - name: Deploy to ECS
      if: steps.latest-task-def.outputs.exists == 'true'
      uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true
